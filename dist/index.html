<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dual Sync Presentation</title>
  <style>
:root {
  --bg: #ffffff;
  --ink: #171717;
  --muted: #6b7280;
  --line: #e5e7eb;
  --soft: #f6f7f9;
  --red: #a50034;
  --red-soft: #fff0f4;
  --dark: #101114;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
body[data-view="demo"] { background: #0f1117; color: white; }
body[data-view="explain"] { background: white; }
body[data-view="controller"], body[data-view="author"] { background: #f3f4f6; }

.screen { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.9); backdrop-filter: blur(12px); color: var(--ink); }
body[data-view="demo"] .topbar { background: rgba(15,17,23,.86); color: white; border-bottom-color: rgba(255,255,255,.14); }
.topbar strong { margin-right: 12px; }
.topbar span { color: var(--muted); margin-left: 10px; }
body[data-view="demo"] .topbar span { color: #c4c7cf; }
.status { display: flex; gap: 12px; align-items: center; }
.status span { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: inherit; }
body[data-view="demo"] .status span { border-color: rgba(255,255,255,.2); }
.progress { height: 4px; background: rgba(165,0,52,.1); }
.progress div { height: 100%; background: var(--red); transition: width .3s ease; }

.hero { flex: 1; padding: 5vw 7vw; display: flex; flex-direction: column; justify-content: center; }
.eyebrow { margin: 0 0 16px; color: var(--red); font-weight: 800; letter-spacing: 0; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(42px, 5.5vw, 86px); line-height: 1.04; letter-spacing: 0; max-width: 1100px; }
.subtitle, .lead { font-size: clamp(20px, 2vw, 31px); line-height: 1.45; color: var(--muted); max-width: 960px; margin: 24px 0 0; }
body[data-view="demo"] .subtitle { color: #c7cbd4; }

.demo-stage { flex: 1; display: grid; grid-template-rows: auto minmax(320px, 1fr) auto; gap: 24px; padding: 34px; }
.demo-copy h1 { font-size: clamp(36px, 4vw, 64px); }
.video-frame { position: relative; min-height: 360px; border: 1px solid rgba(255,255,255,.16); background: #181b24; overflow: hidden; display: grid; place-items: center; }
.video-layer { position: absolute; inset: 0; transform: scale(1); transform-origin: 50% 50%; transition-property: transform; transition-timing-function: ease; transition-duration: .5s; }
.demo-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #05060a; }
.video-frame[data-video="missing"] .video-layer { opacity: 0; pointer-events: none; }
.video-frame[data-video="ready"] .video-fallback { display: none; }
.video-fallback { position: relative; z-index: 1; display: grid; gap: 12px; justify-items: center; padding: 28px; text-align: center; color: #e5e7eb; }
.video-fallback strong { font-size: clamp(26px, 3vw, 44px); }
.video-fallback span { color: #aeb4c1; font-size: 18px; }
.hotspot-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.demo-hotspot { position: absolute; transform: translate(-50%, -50%); border: 0; background: transparent; padding: 0; border-radius: 4px; color: white; display: grid; place-items: start center; pointer-events: auto; min-width: 20px; min-height: 20px; }
.demo-hotspot:focus-visible { outline: 3px solid rgba(255,255,255,.92); outline-offset: 3px; }
.hotspot-label { transform: translateY(-100%); background: rgba(15,17,23,.78); border: 1px solid rgba(255,255,255,.18); padding: 6px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; pointer-events: none; }
.debug-hotspots .demo-hotspot { border: 2px solid rgba(255,255,255,.86); background: rgba(165,0,52,.2); }
.debug-hotspots .hotspot-label { background: rgba(165,0,52,.94); border-color: rgba(255,255,255,.44); }
.timeline-summary { display: flex; gap: 10px; flex-wrap: wrap; color: #d5d8df; }
.timeline-summary span { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07); padding: 8px 10px; border-radius: 6px; font-size: 13px; }

.chat-panel { width: min(900px, 100%); margin-top: 48px; display: grid; gap: 18px; }
.bubble { padding: 22px 26px; border-radius: 28px; font-size: 24px; line-height: 1.45; box-shadow: 0 16px 55px rgba(0,0,0,.22); }
.bubble.customer { background: #252936; justify-self: start; }
.bubble.ai { background: var(--red); justify-self: end; max-width: 78%; }

.demo-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 50px; }
.demo-cards article { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 28px; padding: 28px; min-height: 230px; }
.demo-cards b { font-size: 28px; }
.demo-cards p { font-size: 22px; line-height: 1.4; color: #eef0f4; }
.demo-cards small { color: #b6bbc7; font-size: 16px; }

.graph-wrap { position: relative; height: 420px; margin-top: 46px; border-radius: 36px; background: radial-gradient(circle at center, rgba(165,0,52,.28), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.14); }
.node { position: absolute; padding: 18px 22px; border-radius: 999px; background: #fff; color: #151515; font-weight: 800; box-shadow: 0 16px 50px rgba(0,0,0,.25); }
.node-0 { left: 8%; top: 20%; } .node-1 { left: 10%; bottom: 16%; } .node-2 { right: 10%; top: 18%; } .node-3 { right: 8%; bottom: 18%; } .node-4 { left: 40%; top: 43%; background: var(--red); color: white; }
.graph-line { position:absolute; inset: 18%; border: 2px dashed rgba(255,255,255,.28); border-radius: 999px; }

.handoff-flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 52px; }
.handoff-flow div { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 26px; padding: 26px; font-size: 22px; min-height: 180px; }
.handoff-flow span { display: grid; place-items: center; width: 42px; height: 42px; background: var(--red); color: white; border-radius: 50%; margin-bottom: 28px; font-weight: 800; }

.summary-ring { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 54px; }
.summary-ring span { padding: 22px 28px; border-radius: 999px; background: white; color: var(--ink); font-weight: 900; font-size: 24px; }

.bullet-list { margin: 42px 0 0; padding: 0; list-style: none; display: grid; gap: 18px; max-width: 1050px; }
.bullet-list li { font-size: clamp(22px, 2.2vw, 34px); line-height: 1.35; background: var(--soft); border: 1px solid var(--line); border-radius: 24px; padding: 22px 26px; }
.bullet-list li::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--red); margin-right: 16px; vertical-align: middle; }
.takeaway { margin-top: 42px; padding: 26px 30px; border-radius: 28px; background: var(--red-soft); color: var(--red); font-size: 28px; font-weight: 900; max-width: 1050px; }
.explain-hero { position: relative; overflow: hidden; }
.explain-content { animation: explainFade .24s ease both; }
.speaker-script { margin-top: 28px; max-width: 1050px; border-top: 1px solid var(--line); padding-top: 20px; color: #30333a; }
.speaker-script h2 { margin: 0 0 8px; color: var(--red); font-size: 16px; text-transform: uppercase; letter-spacing: 0; }
.speaker-script p { margin: 0; font-size: 20px; line-height: 1.55; color: #30333a; }
.explain-debug { position: absolute; right: 28px; bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: min(720px, calc(100% - 56px)); color: #4b5563; }
.explain-debug span { border: 1px solid var(--line); background: rgba(255,255,255,.9); padding: 7px 9px; border-radius: 6px; font-size: 12px; }
@keyframes explainFade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.controller-layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1.28fr) minmax(380px, .72fr); gap: 24px; padding: 28px; }
.controller-main, .speaker-note { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 28px; box-shadow: 0 12px 40px rgba(15,17,23,.08); }
.controller-current { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 22px; align-items: start; }
.controller-main h1 { font-size: clamp(38px, 4vw, 58px); }
.console-label { display: inline-block; margin-bottom: 8px; color: var(--red); font-size: 13px; font-weight: 900; text-transform: uppercase; }
.console-state { min-width: 140px; display: grid; gap: 8px; justify-items: center; border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 16px; }
.console-state strong { font-size: 28px; line-height: 1; }
.console-state span { color: var(--muted); font-weight: 800; }
.console-state.is-playing { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.console-state.is-playing span { color: var(--red); }
.controller-description { max-width: 760px; color: var(--muted); font-size: 20px; line-height: 1.45; margin: 16px 0 0; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.transport-controls button { min-height: 58px; min-width: 124px; font-size: 18px; }
button, .open-links a { appearance: none; border: 1px solid var(--line); background: white; border-radius: 8px; padding: 14px 18px; font-weight: 800; cursor: pointer; text-decoration: none; color: var(--ink); font-size: 16px; }
button.primary { background: var(--red); color: white; border-color: var(--red); }
button.active-toggle { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.video-status { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px; color: #30333a; }
.video-status span { border: 1px solid var(--line); background: var(--soft); padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 800; line-height: 1.35; }
.jump-time-control { margin-top: 20px; display: grid; gap: 10px; }
.jump-time-control label { color: var(--red); font-size: 16px; font-weight: 900; }
.jump-time-control div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.jump-time-control input { width: 100%; min-height: 52px; border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; font: inherit; font-weight: 800; }
.console-panel { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 22px; }
.speed-control h2, .explain-control h2 { margin: 0 0 12px; font-size: 18px; color: var(--red); }
.speed-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.speed-button { border-radius: 8px; padding: 12px 16px; font-size: 15px; min-width: 74px; }
.speed-button.active { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.explain-step-buttons { display: grid; gap: 10px; }
.explain-step-button { text-align: left; border-radius: 8px; padding: 14px; font-size: 16px; line-height: 1.35; }
.explain-step-button.active { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.jump-grid { display: grid; gap: 10px; margin: 0 0 28px; }
.jump { text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; }
.jump span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--soft); color: var(--muted); }
.jump strong { overflow-wrap: anywhere; }
.jump.active { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.jump.active span { background: var(--red); color: white; }
.speaker-note h2 { margin: 0 0 12px; font-size: 18px; color: var(--red); }
.speaker-note p { font-size: 20px; line-height: 1.65; color: #30333a; margin-bottom: 28px; }
.open-links { display: grid; gap: 12px; margin-top: 24px; }
.open-links a { text-align: center; background: #111827; color: white; }

.author-layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(390px, .48fr); gap: 24px; padding: 28px; }
.author-workspace, .author-panel { min-width: 0; }
.author-workspace { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 28px; box-shadow: 0 12px 40px rgba(15,17,23,.08); }
.author-workspace h1 { font-size: clamp(36px, 4vw, 58px); }
.author-video-control { display: grid; gap: 10px; margin-top: 24px; }
.author-video-control label, .author-grid label { color: #30333a; font-size: 14px; font-weight: 900; }
.author-video-control div { display: grid; grid-template-columns: minmax(180px, .42fr) minmax(0, 1fr) auto; gap: 10px; }
.author-video-control input, .author-video-control select, .author-grid input, .author-grid select, .author-wide-label textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; font: inherit; color: var(--ink); background: white; }
.author-wide-label { display: grid; gap: 6px; margin-bottom: 12px; color: #30333a; font-size: 14px; font-weight: 900; }
.author-wide-label textarea { min-height: 86px; resize: vertical; padding: 12px; line-height: 1.45; }
.author-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.author-toolbar span { min-height: 48px; display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 0 14px; color: #30333a; font-weight: 800; }
.author-video-frame { position: relative; margin-top: 20px; aspect-ratio: 16 / 9; min-height: 320px; overflow: hidden; border: 1px solid #cfd4dc; border-radius: 8px; background: #080a0f; cursor: crosshair; }
.author-video-frame.is-armed { border-color: var(--red); box-shadow: 0 0 0 4px rgba(165,0,52,.12); }
.author-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #05060a; }
.author-hotspot-layer { position: absolute; inset: 0; pointer-events: none; }
.author-hotspot { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; border: 2px solid rgba(255,255,255,.9); border-radius: 4px; background: rgba(165,0,52,.28); color: white; font-size: 12px; font-weight: 900; text-align: center; padding: 4px; overflow: hidden; overflow-wrap: anywhere; }
.author-click-marker { position: absolute; z-index: 3; width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; background: var(--red); transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(165,0,52,.3); pointer-events: none; }
.author-panel { display: grid; gap: 16px; align-content: start; }
.author-card { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: 0 12px 40px rgba(15,17,23,.08); }
.author-card h2 { margin: 0 0 14px; font-size: 18px; color: var(--red); }
.author-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.author-grid label { display: grid; gap: 6px; }
.author-section-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.author-step-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.author-step-list span { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 7px 10px; color: #30333a; font-size: 12px; font-weight: 900; }
.author-step-list span.is-default { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.author-preview-card { min-height: 360px; display: grid; grid-template-rows: auto minmax(260px, 1fr) auto; }
.author-preview-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.author-preview-header h2 { margin: 0; }
.author-preview-card textarea { width: 100%; min-height: 260px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 14px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #111827; background: #f9fafb; }
.author-copy-status { min-height: 20px; margin: 8px 0 0; color: var(--red); font-weight: 800; }

@media (max-width: 900px) {
  .controller-layout, .author-layout, .demo-cards, .handoff-flow { grid-template-columns: 1fr; }
  .topbar { height: auto; align-items: flex-start; gap: 10px; flex-direction: column; padding: 16px; }
  .hero { padding: 40px 24px; }
  .author-grid { grid-template-columns: 1fr; }
  .author-video-control div { grid-template-columns: 1fr; }
}

.author-workspace h1 { font-size: clamp(34px, 3.6vw, 54px); }
.author-toolbox, .author-timeline-card { margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; background: #f9fafb; padding: 18px; }
.author-toolbox { display: grid; gap: 14px; }
.author-toolbox h2, .author-timeline-header h2 { margin: 0; font-size: 20px; color: var(--ink); }
.author-toolbox p[data-author-tool-help] { margin: 0; color: #4b5563; font-weight: 800; }
.author-tool-buttons { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.author-tool-button { min-height: 78px; display: grid; align-content: start; gap: 4px; text-align: left; border-radius: 10px; padding: 10px; background: white; }
.author-tool-button strong { color: var(--ink); font-size: 14px; }
.author-tool-button span { color: #6b7280; font-size: 11px; line-height: 1.25; }
.author-tool-button.active { border-color: var(--red); background: var(--red-soft); box-shadow: 0 0 0 3px rgba(165,0,52,.1); }
.author-tool-button.active strong, .author-tool-button.active span { color: var(--red); }
.author-timeline-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.author-timeline { position: relative; display: grid; gap: 8px; user-select: none; }
.author-ruler, .author-timeline-row { position: relative; min-height: 54px; border: 1px solid #d1d5db; border-radius: 8px; background: white; overflow: hidden; }
.author-ruler { background: linear-gradient(180deg, #111827 0%, #1f2937 100%); color: white; cursor: pointer; }
.author-ruler-tick { position: absolute; top: 0; bottom: 0; transform: translateX(-50%); color: #d1d5db; font-size: 11px; font-weight: 900; pointer-events: none; }
.author-ruler-tick i { display: block; width: 1px; height: 18px; margin: 0 auto 4px; background: rgba(255,255,255,.38); }
.author-ruler-tick b { display: block; white-space: nowrap; }
.author-trim-range { position: absolute; top: 25px; bottom: 8px; border: 2px solid #fbbf24; border-radius: 999px; background: rgba(251,191,36,.2); pointer-events: none; }
.author-trim-handle { position: absolute; top: 22px; z-index: 5; width: 16px; height: 28px; padding: 0; border: 2px solid white; border-radius: 5px; background: #f59e0b; transform: translateX(-50%); cursor: ew-resize; }
.author-playhead { position: absolute; top: 0; bottom: 0; z-index: 4; width: 2px; background: var(--red); transform: translateX(-50%); pointer-events: none; }
.author-playhead::before { content: ""; position: absolute; top: 0; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--red); transform: translateX(-50%); }
.author-timeline-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); background: #f3f4f6; cursor: copy; }
.author-track-label { display: flex; align-items: center; padding: 0 12px; border-right: 1px solid #d1d5db; color: #374151; font-size: 13px; font-weight: 900; background: #e5e7eb; }
.author-track { position: relative; min-height: 54px; background: repeating-linear-gradient(90deg, #fff, #fff calc(10% - 1px), #eef2f7 10%); }
.author-timeline-marker { position: absolute; top: 11px; min-width: 18px; height: 32px; overflow: hidden; border: 0; border-radius: 8px; padding: 0 9px; transform: translateX(-1px); color: white; font-size: 11px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; cursor: grab; box-shadow: 0 7px 18px rgba(17,24,39,.18); }
.author-timeline-marker:active { cursor: grabbing; }
.author-timeline-marker.hotspot { background: #a50034; }
.author-timeline-marker.zoom { background: #2563eb; }
.author-timeline-marker.time { background: #059669; }
.author-timeline-marker.is-selected { outline: 3px solid #fbbf24; outline-offset: 2px; }
.author-hotspot.is-selected { border-color: #fbbf24; box-shadow: 0 0 0 4px rgba(251,191,36,.25); }
.author-selected-summary { margin: 0 0 14px; border: 1px dashed var(--line); border-radius: 8px; background: #f9fafb; padding: 10px 12px; color: #4b5563; font-weight: 800; }

@media (max-width: 1180px) {
  .author-tool-buttons { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

@media (max-width: 700px) {
  .author-tool-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .author-timeline-row { grid-template-columns: 1fr; }
  .author-track-label { min-height: 34px; border-right: 0; border-bottom: 1px solid #d1d5db; }
}

</style>
</head>

    presentation.setStep(data.step ?? data.sceneIndex);
    resetVideoForScene();
    render();
  }

  if (data.type === "PLAY") {
    presentation.setPlaying(true);
    if (view === "demo") {
      setActiveVideoPlaying(true);
      renderPlaybackStatusOnly();
    } else {
      render();
    }
  }

  if (data.type === "PAUSE") {
    if (view === "controller") {
      pauseTimer(false);
    } else {
      presentation.setPlaying(false);
      if (view === "demo") {
        setActiveVideoPlaying(false);
        renderPlaybackStatusOnly();
      } else {
        render();
      }
    }
  }

  if (data.type === "RESET_TIMER") {
    presentation.resetRemainingSec();
    render();
  }

  if (data.type === "RESTART_SCENE") {
    presentation.setStep(data.sceneIndex ?? state.currentStep);
    presentation.setPlaying(false);
    presentation.clearTimer();
    if (view === "demo") {
      restartActiveVideo();
      renderPlaybackStatusOnly();
    } else {
      render();
    }
  }

  if (data.type === "SYNC_EXPLAIN") {
    if (Number.isFinite(data.sceneIndex) && data.sceneIndex !== state.currentStep) {
      presentation.setStep(data.sceneIndex);
    }
    presentation.setExplainStep(data.explainStepId);
    render();
  }

  if (data.type === "VIDEO_TIME_UPDATE" && view === "controller") {
    presentation.setVideoStatus(data);
    renderControllerVideoStatusOnly();
  }

  if (data.type === "JUMP_TO_TIME" && view === "demo") {
    seekActiveVideo(data.time);
  }

  if (data.type === "RESET_ZOOM" && view === "demo") {
    resetActiveVideoZoom();
  }

  if (data.type === "SET_PLAYBACK_RATE") {
    presentation.setPlaybackRate(data.playbackRate);
    if (view === "demo") {
      setActiveVideoPlaybackRate(state.playbackRate);
    } else {
      render();
    }
  }

  if (data.type === "SET_DEBUG_HOTSPOTS") {
    presentation.setDebugHotspots(data.debugHotspots);
    if (view === "demo") {
      updateDemoHotspotDebugOnly();
    } else {
      render();
    }
  }

  if (data.type === "SET_HOTSPOT_DEBUG") {
    presentation.setDebugHotspots(data.enabled);
    if (view === "demo") {
      updateDemoHotspotDebugOnly();
    } else {
      render();
    }
  }
}

function setStep(step, shouldBroadcast = true) {
  presentation.setStep(step);
  resetVideoForScene();
  render();

  if (shouldBroadcast) {
    sync.broadcast("SET_STEP", { step: state.currentStep });
  }
}

function nextStep() {
  setStep(state.currentStep + 1);
}

function prevStep() {
  setStep(state.currentStep - 1);
}

function startTimer() {
  presentation.setPlaying(true);
  presentation.clearTimer();
  presentation.setTimer(setInterval(() => {
    presentation.setRemainingSec(state.remainingSec - 1);

    if (state.remainingSec <= 0) {
      presentation.clearTimer();
      presentation.setPlaying(false);

      if (state.currentStep < scenes.length - 1) {
        nextStep();
      } else {
        render();
      }
    } else {
      renderTimerOnly();
    }
  }, 1000));

  sync.broadcast("PLAY", { step: state.currentStep });
  render();
}

function pauseTimer(shouldBroadcast = true) {
  presentation.setPlaying(false);
  presentation.clearTimer();

  if (shouldBroadcast) {
    sync.broadcast("PAUSE", { step: state.currentStep, remainingSec: state.remainingSec });
  }

  render();
}

function resetTimer() {
  pauseTimer(false);
  presentation.resetRemainingSec();
  sync.broadcast("RESET_TIMER", { step: state.currentStep });
  render();
}

function restartScene() {
  presentation.setPlaying(false);
  presentation.clearTimer();
  presentation.setStep(state.currentStep);
  sync.broadcast("RESTART_SCENE", { sceneIndex: state.currentStep });
  render();
}

function resetZoom() {
  sync.broadcast("RESET_ZOOM", { sceneIndex: state.currentStep });
}

function setPlaybackRate(playbackRate) {
  presentation.setPlaybackRate(playbackRate);
  sync.broadcast("SET_PLAYBACK_RATE", {
    sceneIndex: state.currentStep,
    playbackRate: state.playbackRate
  });
  render();
}

function jumpToSceneTime(sceneTime) {
  const scene = scenes[state.currentStep];
  const trimStart = scene?.demo?.trim?.start || 0;
  const trimEnd = scene?.demo?.trim?.end || trimStart;
  const numericSceneTime = Number(sceneTime);
  if (!Number.isFinite(numericSceneTime)) return;

  const targetTime = Math.max(trimStart, Math.min(trimEnd, trimStart + Math.max(0, numericSceneTime)));
  sync.broadcast("JUMP_TO_TIME", {
    sceneIndex: state.currentStep,
    time: targetTime
  });
  presentation.setVideoStatus({
    sceneIndex: state.currentStep,
    currentTime: targetTime,
    isPlaying: state.isPlaying
  });
  renderControllerVideoStatusOnly();
}

function formatVideoClock(seconds, fallback = 0) {
  const numericSeconds = Number.isFinite(Number(seconds)) ? Number(seconds) : fallback;
  const safeSeconds = Math.max(0, numericSeconds);
  const minutes = Math.floor(safeSeconds / 60).toString().padStart(2, "0");
  const remainingSeconds = (safeSeconds % 60).toFixed(2).padStart(5, "0");
  return `${minutes}:${remainingSeconds}`;
}

function renderTimerOnly() {
  const timer = document.querySelector("[data-timer]");
  if (timer) timer.textContent = formatTime(state.remainingSec);
}

function renderControllerVideoStatusOnly() {
  const videoStatus = document.querySelector(".video-status");
  if (!videoStatus || view !== "controller") return;

  const scene = scenes[state.currentStep];
  const trim = scene.demo?.trim || { start: 0, end: 0 };
  const currentTime = state.videoStatus?.currentTime ?? trim.start;
  const sceneElapsed = Math.max(0, Number(currentTime || trim.start) - Number(trim.start || 0));
  const sceneDuration = Math.max(0, Number(trim.end || 0) - Number(trim.start || 0));
  const currentExplainStep = getExplainStep(scene, state.currentExplainStepId);

  videoStatus.innerHTML = `
    <span>현재 영상 시간 ${formatVideoClock(currentTime, trim.start)} / ${formatVideoClock(trim.end, 0)}</span>
    <span>Scene Time ${formatVideoClock(sceneElapsed, 0)} / ${formatVideoClock(sceneDuration, 0)}</span>
    <span>현재 Explain ${currentExplainStep.title || "none"}</span>
  `;
}

function renderPlaybackStatusOnly() {
  const status = document.querySelector(".status span:last-child");
  if (status) status.textContent = state.isPlaying ? "PLAY" : "PAUSE";
}

function updateDemoHotspotDebugOnly() {
  const frame = document.querySelector(".video-frame");
  if (!frame || view !== "demo") return;

  frame.classList.toggle("debug-hotspots", state.debugHotspots);
  frame.dataset.debugHotspots = state.debugHotspots ? "true" : "false";
}

function syncExplain(explainStepId, shouldBroadcast = true) {
  presentation.setExplainStep(explainStepId);
  if (view !== "demo") {
    render();
  }

  if (shouldBroadcast) {
    sync.broadcast("SYNC_EXPLAIN", {
      sceneIndex: state.currentStep,
      explainStepId
    });
  }
}

function handleVideoPause() {
  presentation.setPlaying(false);
  presentation.clearTimer();
  sync.broadcast("PAUSE", { step: state.currentStep, remainingSec: state.remainingSec });
  renderPlaybackStatusOnly();
}

function handleVideoPlaybackStateChange(isPlaying) {
  presentation.setPlaying(isPlaying);
  renderPlaybackStatusOnly();
}

function render() {
  const scene = scenes[state.currentStep];
  document.body.dataset.view = view;

  if (view === "demo") {
    app.innerHTML = renderDemoView({ scene, scenes, state });
    mountVideoTimeline({
      scene,
      sceneIndex: state.currentStep,
      isPlaying: state.isPlaying,
      broadcast: sync.broadcast,
      onPause: handleVideoPause,
      onNextScene: nextStep,
      onSyncExplain: syncExplain,
      onPlaybackStateChange: handleVideoPlaybackStateChange,
      playbackRate: state.playbackRate
    });
  } else if (view === "author") {
    resetVideoForScene();
    app.innerHTML = renderAuthorView({ scenes, state });
    mountAuthorView();
  } else if (view === "explain") {
    app.innerHTML = renderExplainView({ scene, scenes, state });
  } else {
    app.innerHTML = renderControllerView({ scene, scenes, state });
  }
}

app.addEventListener("click", (event) => {
  const control = event.target.closest("[data-action]");
  if (!control) return;

  const action = control.dataset.action;

  if (action === "prev") prevStep();
  if (action === "next") nextStep();
  if (action === "play-toggle") state.isPlaying ? pauseTimer() : startTimer();
  if (action === "reset") resetTimer();
  if (action === "restart-scene") restartScene();
  if (action === "reset-zoom") resetZoom();
  if (action === "set-step") setStep(Number(control.dataset.step));
  if (action === "sync-explain") syncExplain(control.dataset.explainStepId);
  if (action === "set-playback-rate") setPlaybackRate(Number(control.dataset.playbackRate));
  if (action === "toggle-debug-hotspots") {
    presentation.setDebugHotspots(!state.debugHotspots);
    sync.broadcast("SET_HOTSPOT_DEBUG", { enabled: state.debugHotspots });
    render();
  }
});

app.addEventListener("submit", (event) => {
  const form = event.target.closest("[data-jump-form]");
  if (!form) return;

  event.preventDefault();
  jumpToSceneTime(form.querySelector("[data-jump-time]")?.value);
});

window.addEventListener("keydown", (event) => {
  if (view === "author") return;

  if (["ArrowRight", "Space", "PageDown"].includes(event.code)) nextStep();
  if (["ArrowLeft", "PageUp"].includes(event.code)) prevStep();
  if (event.code === "KeyP") state.isPlaying ? pauseTimer() : startTimer();
  if (event.code === "KeyR") resetTimer();
});

render();

function formatPlaybackRate(rate) {
  return Number(rate || 1).toFixed(2).replace(/\.?0+$/, "");
}

function getExplainStep(scene, explainStepId) {
  const steps = scene.explain?.steps || [];
  return steps.find((step) => step.id === explainStepId)
    || steps.find((step) => step.id === scene.explain?.defaultStepId)
    || steps[0]
    || {};
}
